name: Android signed GitHub Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
      ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check release tag matches Android version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' android/app/build.gradle.kts | head -1)
          test -n "$VERSION"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Android version v$VERSION"
            exit 1
          fi
      - name: Restore private signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SIGNING_KEYSTORE_B64:-}" ] || [ -z "${ANDROID_SIGNING_PASSWORD:-}" ]; then
            echo "::error::Configure ANDROID_SIGNING_KEYSTORE_B64 and ANDROID_SIGNING_PASSWORD in repo Actions secrets."
            exit 1
          fi
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/sqltrainer-signing.jks"
          chmod 600 "$RUNNER_TEMP/sqltrainer-signing.jks"
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/sqltrainer-signing.jks" >> "$GITHUB_ENV"
      - name: Validate offline SQL exercises
        run: python3 scripts/verify_practice.py
        working-directory: android
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
        working-directory: android
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
        working-directory: android
      - name: Verify package signature and create checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" android/sql-trainer.apk
          cd android
          sha256sum sql-trainer.apk > SHA256SUMS
      - name: Publish signed GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            android/sql-trainer.apk \
            android/SHA256SUMS \
            --title "SQL Trainer $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
