name: Android build
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate all reference SQL exercises and lesson guides
        run: python3 scripts/verify_practice.py
        working-directory: android
      - name: Validate detailed lessons and SQL dialect annotations
        run: python3 scripts/verify_lesson_content.py
        working-directory: android
      - name: Verify mobile learning flow and launcher icon
        run: python3 scripts/verify_mobile_course.py
        working-directory: android
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
        working-directory: android
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sql-trainer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
